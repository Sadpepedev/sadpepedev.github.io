<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airdrop Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffbe33;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      background-color: #007BFF;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .results {
      margin-top: 20px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Derive X Etherfi Event</h1>
    <label for="airdropPercentage">Total Airdrop Allocation (The community average is around 7.5% historically)</label>
    <input type="number" id="airdropPercentage" placeholder="Enter allocation of total supply as a percentage (e.g 7.5%)" />

    <label for="fdv">Fully Diluted Valuation of Derive(FDV in $)</label>
    <input type="number" id="fdv" placeholder="Enter FDV (Lyra was 135,000,000)" />

    <label for="participants">Number of Event Participants (This is currently capped at 1000 users for this event) </label>
    <input type="number" id="participants" placeholder="Enter the number of participants (This event is capped at 1000)" />

    <button onclick="calculate()">Calculate</button>

    <div class="results" id="results"></div>
  </div>

  <script>
    function calculate() {
      const totalSupply = 1000000000; // Total supply of tokens
      const airdropPercentage = parseFloat(document.getElementById("airdropPercentage").value);
      const fdv = parseFloat(document.getElementById("fdv").value);
      const participants = parseInt(document.getElementById("participants").value);

      if (!airdropPercentage || !fdv || !participants) {
        document.getElementById("results").innerHTML = "<p style='color: red;'>Please fill in all fields correctly.</p>";
        return;
      }

      // Calculate the total airdrop allocation in tokens
      const totalAirdropTokens = (totalSupply * airdropPercentage) / 100;

      // Calculate the 2.5% of the airdrop allocation
      const allocationTokens = totalAirdropTokens * 0.025;

      // Calculate the price per token
      const tokenPrice = fdv / totalSupply;

      // Calculate total value and individual value
      const maxTotalValue = allocationTokens * tokenPrice;
      const maxIndividualValue = maxTotalValue / participants;

      // Display results
      document.getElementById("results").innerHTML = `
        <h3>Results:</h3>
        <p><strong>Total Airdrop Tokens:</strong> ${totalAirdropTokens.toLocaleString()} tokens</p>
        <p><strong>Tokens Allocated to 2.5%:</strong> ${allocationTokens.toLocaleString()} tokens</p>
        <p><strong>Max Total Value:</strong> $${maxTotalValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
        <p><strong>Max Individual Value:</strong> $${maxIndividualValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} per person</p>
      `;
    }
  </script>
</body>
</html>
